<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SEENTAIR: Streetwear</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcf9f8" />
    <meta
      name="description"
      content="Seentair Limited: streetwear manufactured in-house. Shop the look."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Defaults for the very first paint, and for anything that never runs the
         app (a crawler, a link unfurl). SeoService overwrites these per page
         once the data has loaded, so the tab and share previews are specific. -->
    <meta property="og:site_name" content="SEENTAIR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SEENTAIR: Streetwear" />
    <meta
      property="og:description"
      content="Seentair Limited: streetwear manufactured in-house. Shop the look."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved theme before first paint to avoid a light-flash.
       The ThemeService keeps this key in sync. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('seentair.theme');
          if (t !== 'light' && t !== 'dark') {
            t = 'light';
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          /* storage unavailable, defaults to light */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
