<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Seentair Operations</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbf9f4">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght@20..48,300..700&display=block">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('seentair.theme');
        if (t !== 'light' && t !== 'dark') {
          t = 'light';
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) { /* storage unavailable — defaults to light */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
