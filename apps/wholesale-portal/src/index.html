<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Seentair Wholesale</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f2ea" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved theme before first paint. ThemeService keeps this key. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('seentair.theme');
          if (t !== 'light' && t !== 'dark') {
            t = 'light';
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          /* storage unavailable, defaults to light */
        }
      })();
    </script>
    <style>
      #app-preloader {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #f6f4ef; color: #1e2a24;
        transition: opacity .45s ease, visibility .45s ease;
      }
      [data-theme='dark'] #app-preloader { background: #141615; color: #e8ece9; }
      #app-preloader.app-preloader--done { opacity: 0; visibility: hidden; }
      .apl-scene { width: 180px; height: 150px; overflow: visible; }
      .apl-shadow { fill: #1e2a24; opacity: .12; }
      [data-theme='dark'] .apl-shadow { fill: #000; opacity: .35; }
      .apl-frame { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .apl-mesh { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; opacity: .38; }
      .apl-wheel-rim { fill: #e9e6de; stroke: currentColor; stroke-width: 3; }
      [data-theme='dark'] .apl-wheel-rim { fill: #242624; }
      .apl-wheel-hub { fill: currentColor; opacity: .55; }
      .apl-fill { fill: #3f7a59; transform-origin: 80px 98px; transform: scaleY(0); opacity: .5; }
      [data-theme='dark'] .apl-fill { fill: #4f9a73; opacity: .45; }
      .apl-item { opacity: 0; transform-box: fill-box; transform-origin: center bottom; }
      .apl-box-a { fill: #4f8f69; } .apl-box-b { fill: #6aa883; } .apl-box-c { fill: #3f7a59; }
      .apl-bag { fill: #d8b06a; } .apl-bottle { fill: #5c8fb8; }
      .apl-cap { fill: #c9d4dd; } .apl-ribbon { fill: #e8c97a; opacity: .9; }
      .apl-detail { stroke: rgba(255,255,255,.35); stroke-width: 1.2; fill: none; }
      [data-theme='dark'] .apl-box-a { fill: #4f9a73; } [data-theme='dark'] .apl-box-b { fill: #67b089; } [data-theme='dark'] .apl-box-c { fill: #3f7a59; }
      .apl-i1 { animation: apl-drop 3s cubic-bezier(.2,.7,.2,1) infinite 0s; }
      .apl-i2 { animation: apl-drop 3s cubic-bezier(.2,.7,.2,1) infinite .45s; }
      .apl-i3 { animation: apl-drop 3s cubic-bezier(.2,.7,.2,1) infinite .9s; }
      .apl-i4 { animation: apl-drop 3s cubic-bezier(.2,.7,.2,1) infinite 1.35s; }
      .apl-i5 { animation: apl-drop 3s cubic-bezier(.2,.7,.2,1) infinite 1.8s; }
      .apl-fill-anim { animation: apl-fill 3s ease-in-out infinite; }
      #app-preloader.app-preloader--done .apl-fill-anim { animation: none; transform: scaleY(1); transition: transform .3s ease; }
      #app-preloader.app-preloader--done .apl-item { animation: none; opacity: 1; transform: none; }
      .apl-label { font: 500 13px/1.2 "Urbanist", system-ui, sans-serif; letter-spacing: .05em; opacity: .7; }
      @keyframes apl-drop {
        0%, 6% { transform: translateY(-60px) scale(.9); opacity: 0; }
        14% { transform: translateY(0) scale(1); opacity: 1; }
        18% { transform: translateY(-6px) scaleY(.96); opacity: 1; }
        22%, 100% { transform: translateY(0) scale(1); opacity: 1; }
      }
      @keyframes apl-fill {
        0%, 10% { transform: scaleY(.04); }
        18% { transform: scaleY(.22); }
        36% { transform: scaleY(.42); }
        54% { transform: scaleY(.62); }
        72% { transform: scaleY(.8); }
        88%, 100% { transform: scaleY(.94); }
      }
      @media (prefers-reduced-motion: reduce) {
        .apl-item, .apl-fill-anim { animation: none !important; opacity: 1; transform: none !important; }
        .apl-fill-anim { transform: scaleY(.94); }
        #app-preloader.app-preloader--done .apl-fill-anim { transform: scaleY(1); }
      }
    </style>
  </head>
  <body>
    <div id="app-preloader" aria-label="Loading" role="status">
      <svg class="apl-scene" viewBox="0 0 160 150" aria-hidden="true">
        <defs>
          <clipPath id="apl-basket-clip">
            <path d="M36 48 L124 48 L114 98 L46 98 Z" />
          </clipPath>
        </defs>
        <ellipse class="apl-shadow" cx="80" cy="132" rx="44" ry="7" />
        <path class="apl-frame" d="M14 18 L28 18 L40 48 L124 48 L114 98 L46 98 L28 18" />
        <path class="apl-frame" d="M46 48 L38 98" />
        <path class="apl-frame" d="M40 48 L124 48" />
        <g class="apl-mesh">
          <path d="M58 48 L54 98" /><path d="M72 48 L70 98" /><path d="M86 48 L86 98" /><path d="M100 48 L102 98" /><path d="M114 48 L114 98" />
          <path d="M38 60 L121 60" /><path d="M40 73 L118 73" /><path d="M43 86 L116 86" />
        </g>
        <g clip-path="url(#apl-basket-clip)">
          <rect class="apl-fill apl-fill-anim" x="36" y="48" width="88" height="50" />
          <g class="apl-item apl-i1">
            <rect class="apl-box-c" x="48" y="78" width="22" height="18" rx="3" />
            <path class="apl-detail" d="M59 78 v18 M48 87 h22" />
          </g>
          <g class="apl-item apl-i2">
            <rect class="apl-box-a" x="72" y="80" width="20" height="16" rx="3" />
            <rect class="apl-ribbon" x="80" y="80" width="4" height="16" rx="1" />
          </g>
          <g class="apl-item apl-i3">
            <path class="apl-bag" d="M94 76 h16 v18 a3 3 0 0 1 -3 3 h-10 a3 3 0 0 1 -3 -3 z" />
            <path class="apl-detail" d="M98 76 c0 -6 8 -6 8 0" />
          </g>
          <g class="apl-item apl-i4">
            <rect class="apl-box-b" x="56" y="62" width="24" height="15" rx="3" />
            <path class="apl-detail" d="M68 62 v15" />
          </g>
          <g class="apl-item apl-i5">
            <rect class="apl-bottle" x="84" y="58" width="12" height="20" rx="4" />
            <rect class="apl-cap" x="86" y="54" width="8" height="5" rx="2" />
            <rect fill="#fff" opacity=".25" x="86" y="62" width="3" height="10" rx="1.5" />
          </g>
        </g>
        <circle class="apl-wheel-rim" cx="56" cy="108" r="8" />
        <circle class="apl-wheel-hub" cx="56" cy="108" r="2.5" />
        <circle class="apl-wheel-rim" cx="104" cy="108" r="8" />
        <circle class="apl-wheel-hub" cx="104" cy="108" r="2.5" />
        <path class="apl-frame" d="M46 98 L56 100 M114 98 L104 100" />
      </svg>
      <span class="apl-label">Loading</span>
    </div>
    <app-root></app-root>
  </body>
</html>
